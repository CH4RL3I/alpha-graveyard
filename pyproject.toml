[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratgen"
version = "0.1.0"
description = "Automated trading-strategy discovery, and an honest look at how few discoveries survive out of sample."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emilio Gappa", email = "emiliogappa@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "overfit @ git+https://github.com/CH4RL3I/fluke",
]

[project.scripts]
stratgen = "stratgen.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/stratgen"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
